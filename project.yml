name: BakingApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.pandauser2.BakingApp
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1,2"
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.30.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.21.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  BakingApp:
    type: application
    platform: iOS
    sources:
      - path: BakingApp
        excludes:
          - "**/*.md"
    configFiles:
      Debug: BakingApp/Resources/Config/Debug.xcconfig
      Release: BakingApp/Resources/Config/Release.xcconfig
    info:
      path: BakingApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Baking App
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.pandauser2.BakingApp.auth
            CFBundleURLSchemes:
              - bakingapp
        NSCameraUsageDescription: Capture starter and loaf photos for AI analysis.
        NSPhotoLibraryUsageDescription: Select starter and loaf photos for AI analysis.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_PUBLIC_KEY: $(REVENUECAT_PUBLIC_KEY)
        REVENUECAT_ENTITLEMENT_ID: $(REVENUECAT_ENTITLEMENT_ID)
    entitlements:
      path: BakingApp/Resources/BakingApp.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BakingApp/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
  BakingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandauser2.BakingAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BakingApp
schemes:
  BakingApp:
    build:
      targets:
        BakingApp: all
        BakingAppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: BakingApp/Resources/BakingApp.storekit
    test:
      config: Debug
      targets:
        - BakingAppTests
  BakingApp-QA:
    build:
      targets:
        BakingApp: all
        BakingAppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: BakingApp/Resources/BakingApp.storekit
      commandLineArguments:
        "-qaProEntitlement": true
    test:
      config: Debug
      targets:
        - BakingAppTests

